<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start Listening</title>
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Start Listening">
<link rel="apple-touch-icon" href="https://archive.org/download/repjesus-dj-jaysmoke/cover.jpg">
<link rel="icon" href="https://archive.org/download/repjesus-dj-jaysmoke/cover.jpg">
<style>
:root{
  --bg:#0b0b0f; --bg2:#14141b; --card:#1b1b24; --card2:#23232f;
  --text:#f4f4f6; --muted:#a2a2ae; --accent:#e8b33c; --accent2:#c9932b;
  --danger:#e5534b; --ok:#3fb96f; --line:#2a2a36;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; padding-bottom:calc(132px + var(--safe-b));}
button{font-family:inherit; cursor:pointer;}
img{display:block;}
header.top{position:sticky; top:0; z-index:30; background:rgba(11,11,15,.94); backdrop-filter:blur(8px); display:flex; align-items:center; gap:10px; padding:12px 14px 10px; border-bottom:1px solid var(--line);}
header.top .ttl{font-size:19px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.backbtn{background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:999px; width:38px; height:38px; font-size:19px; line-height:1; flex:0 0 auto;}
main{padding:6px 14px 20px; max-width:860px; margin:0 auto;}
h2.sec{font-size:19px; margin:22px 0 10px;}
h3.sub{font-size:15px; color:var(--muted); margin:16px 0 8px; font-weight:600;}
.muted{color:var(--muted);} .small{font-size:13px;}
.hero{background:linear-gradient(135deg,#2a2113,#1b1b24 70%); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; gap:14px; align-items:center; margin-top:12px;}
.hero img{width:92px; height:92px; border-radius:12px; object-fit:cover; flex:0 0 auto;}
.hero .ht{font-size:13px; color:var(--accent); font-weight:700; letter-spacing:.06em; text-transform:uppercase;}
.hero .he{font-size:18px; font-weight:700; margin:3px 0; line-height:1.25;}
.hero .hs{color:var(--muted); font-size:14px;}
.bigplay{background:var(--accent); color:#191204; border:none; border-radius:999px; padding:13px 22px; font-size:16px; font-weight:800; margin-top:10px; display:inline-flex; align-items:center; gap:8px;}
.bigplay:active{background:var(--accent2);}
.prog{height:5px; background:#33333f; border-radius:99px; margin-top:10px; overflow:hidden;}
.prog>i{display:block; height:100%; background:var(--accent); border-radius:99px;}
.shelf{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.shelf::-webkit-scrollbar{display:none;}
.scard{flex:0 0 128px; width:128px; background:none; border:none; color:var(--text); text-align:left; padding:0;}
.scard img{width:128px; height:128px; border-radius:12px; object-fit:cover; background:var(--card);}
.scard .st{font-size:13.5px; font-weight:600; margin-top:7px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.scard .sa{font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
.acard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; color:var(--text); text-align:left; width:100%;}
.acard img{width:100%; aspect-ratio:1; border-radius:9px; object-fit:cover; background:var(--card2);}
.acard .at{font-weight:700; font-size:14.5px; margin-top:8px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.acard .aa{color:var(--muted); font-size:12.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.listrow{display:flex; align-items:center; gap:12px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; color:var(--text); text-align:left; margin-bottom:9px;}
.listrow img{width:52px; height:52px; border-radius:8px; object-fit:cover; flex:0 0 auto; background:var(--card2);}
.listrow .lt{font-weight:600; font-size:15px; line-height:1.3;}
.listrow .lm{color:var(--muted); font-size:12.5px; margin-top:2px;}
.listrow .chev{margin-left:auto; color:var(--muted); font-size:20px; flex:0 0 auto;}
.eprow{display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--line);}
.eprow.playing{background:rgba(232,179,60,.08); border-radius:10px;}
.eprow .et{flex:1; min-width:0;}
.eprow .ett{font-size:15px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.eprow.playing .ett{color:var(--accent);}
.eprow .etm{color:var(--muted); font-size:12.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.eprow .emain{background:none; border:none; color:inherit; text-align:left; flex:1; min-width:0; display:flex; gap:10px; align-items:center; padding:0;}
.iconbtn{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:999px; width:42px; height:42px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; padding:0;}
.iconbtn svg{width:20px; height:20px;}
.iconbtn.on{color:var(--accent); border-color:var(--accent);}
.iconbtn.done{color:var(--ok); border-color:var(--ok);}
.iconbtn.fail{color:var(--danger); border-color:var(--danger);}
.iconbtn.busy{opacity:.55;}
.showhead{display:flex; gap:14px; align-items:flex-start; margin:14px 0 6px;}
.showhead img{width:118px; height:118px; border-radius:14px; object-fit:cover; background:var(--card);}
.showhead .stt{font-size:21px; font-weight:800; line-height:1.2;}
.btnrow{display:flex; gap:9px; flex-wrap:wrap; margin:12px 0 4px;}
.abtn{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:11px 17px; font-size:14.5px; font-weight:700; display:inline-flex; align-items:center; gap:7px;}
.abtn.primary{background:var(--accent); color:#191204; border-color:var(--accent);}
.abtn.danger{color:var(--danger);}
.abtn svg{width:17px; height:17px;}
.abtn.busy{opacity:.6;}
.genre{display:flex; align-items:center; gap:12px; width:100%; border:none; border-radius:14px; padding:20px 16px; color:#fff; text-align:left; margin-bottom:12px; font-size:19px; font-weight:800;}
.genre .gc{font-size:13px; font-weight:600; opacity:.85; display:block; margin-top:3px;}
.g-urban{background:linear-gradient(120deg,#8a6420,#5c4310);}
.g-sermon{background:linear-gradient(120deg,#33526e,#1d3247);}
.g-teaching{background:linear-gradient(120deg,#5d4a7a,#372a4d);}
input.search{width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--text); font-size:16px; padding:13px 14px; margin:10px 0 4px; outline:none;}
input.search:focus{border-color:var(--accent);}
/* mini player */
#minibar{position:fixed; left:8px; right:8px; bottom:calc(64px + var(--safe-b)); z-index:40; background:#20202b; border:1px solid var(--line); border-radius:14px; display:none; align-items:center; gap:10px; padding:8px 10px; box-shadow:0 8px 24px rgba(0,0,0,.5);}
#minibar.show{display:flex;}
#minibar img{width:46px; height:46px; border-radius:8px; object-fit:cover; background:var(--card2);}
#minibar .mt{flex:1; min-width:0;}
#minibar .mtt{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#minibar .mma{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#minibar .mprog{position:absolute; left:12px; right:12px; bottom:4px; height:3px; background:#3a3a48; border-radius:99px; overflow:hidden;}
#minibar .mprog>i{display:block; height:100%; background:var(--accent);}
/* tab bar */
#tabbar{position:fixed; left:0; right:0; bottom:0; z-index:41; background:rgba(16,16,22,.97); border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);}
#tabbar button{flex:1; background:none; border:none; color:var(--muted); font-size:11px; font-weight:600; padding:8px 2px 7px; display:flex; flex-direction:column; align-items:center; gap:3px;}
#tabbar button svg{width:23px; height:23px;}
#tabbar button.on{color:var(--accent);}
/* full player */
#player{position:fixed; inset:0; z-index:60; background:linear-gradient(180deg,#1d1a12,#0b0b0f 55%); display:none; flex-direction:column; padding:calc(10px + env(safe-area-inset-top,0px)) 22px calc(18px + var(--safe-b)); overflow-y:auto;}
#player.show{display:flex;}
#player .pclose{align-self:flex-start; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:999px; width:40px; height:40px; font-size:18px;}
#player img.pcov{width:min(66vw,320px); height:min(66vw,320px); border-radius:16px; object-fit:cover; margin:16px auto 6px; box-shadow:0 14px 40px rgba(0,0,0,.55); background:var(--card);}
#player .ptt{font-size:20px; font-weight:800; text-align:center; line-height:1.3; margin-top:10px;}
#player .paa{color:var(--muted); text-align:center; margin-top:4px; font-size:15px;}
#player .pup{color:var(--accent); text-align:center; font-size:13px; margin-top:6px; min-height:16px;}
.seekrow{display:flex; align-items:center; gap:10px; margin-top:20px; font-size:12.5px; color:var(--muted);}
input[type=range].seek{flex:1; accent-color:var(--accent); height:28px;}
.transport{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
.tbtn{background:none; border:none; color:var(--text); width:52px; height:52px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:0; position:relative;}
.tbtn svg{width:27px; height:27px;}
.tbtn.on{color:var(--accent);}
.tbtn .bdg{position:absolute; top:6px; right:6px; background:var(--accent); color:#191204; font-size:10px; font-weight:900; border-radius:99px; width:15px; height:15px; line-height:15px; text-align:center;}
.playbtn{background:var(--accent); color:#191204; border:none; border-radius:999px; width:68px; height:68px; display:inline-flex; align-items:center; justify-content:center;}
.playbtn svg{width:32px; height:32px;}
.pillrow{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
.pill{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:9px 15px; font-size:13.5px; font-weight:700; display:inline-flex; gap:6px; align-items:center;}
.pill.on{color:var(--accent); border-color:var(--accent);}
.pill svg{width:16px; height:16px;}
.speedrow{display:flex; gap:7px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
.speedrow button{background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:8px 13px; font-size:13.5px; font-weight:700;}
.speedrow button.on{color:#191204; background:var(--accent); border-color:var(--accent);}
/* sheet */
#sheetwrap{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.6); display:none;}
#sheetwrap.show{display:block;}
#sheet{position:absolute; left:0; right:0; bottom:0; background:#1c1c26; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + var(--safe-b)); max-height:75vh; overflow-y:auto;}
#sheet h3{margin:2px 0 12px; font-size:16px;}
.sheetrow{display:flex; align-items:center; gap:11px; width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--text); padding:13px 4px; font-size:15.5px; text-align:left;}
.sheetrow:last-child{border-bottom:none;}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + var(--safe-b)); z-index:80; background:#2c2c3a; color:var(--text); border:1px solid var(--line); padding:11px 18px; border-radius:999px; font-size:14px; font-weight:600; display:none; box-shadow:0 8px 24px rgba(0,0,0,.5); max-width:88vw; text-align:center;}
.empty{color:var(--muted); text-align:center; padding:34px 10px; font-size:15px;}
</style>
</head>
<body>
<header class="top"><button class="backbtn" id="backbtn" style="display:none" aria-label="Back">‹</button><div class="ttl" id="apptitle">Start Listening</div></header>
<main id="view"></main>

<div id="minibar">
  <img id="mb-cov" alt="">
  <div class="mt"><div class="mtt" id="mb-title">—</div><div class="mma" id="mb-artist">—</div></div>
  <button class="iconbtn" id="mb-repeat" aria-label="Repeat"></button>
  <button class="iconbtn" id="mb-play" aria-label="Play or pause" style="background:var(--accent);color:#191204;border-color:var(--accent)"></button>
  <div class="mprog"><i id="mb-prog" style="width:0%"></i></div>
</div>

<nav id="tabbar"></nav>

<div id="player">
  <button class="pclose" id="pf-close" aria-label="Close player">⌄</button>
  <img class="pcov" id="pf-cov" alt="">
  <div class="ptt" id="pf-title">—</div>
  <div class="paa" id="pf-artist">—</div>
  <div class="pup" id="pf-upnext"></div>
  <div class="seekrow"><span id="pf-cur">0:00</span><input type="range" class="seek" id="pf-seek" min="0" max="1000" value="0"><span id="pf-dur">0:00</span></div>
  <div class="transport">
    <button class="tbtn" id="pf-shuffle" aria-label="Shuffle"></button>
    <button class="tbtn" id="pf-prev" aria-label="Previous"></button>
    <button class="tbtn" id="pf-back30" aria-label="Back 30 seconds"></button>
    <button class="playbtn" id="pf-play" aria-label="Play or pause"></button>
    <button class="tbtn" id="pf-fwd30" aria-label="Forward 30 seconds"></button>
    <button class="tbtn" id="pf-next" aria-label="Next"></button>
    <button class="tbtn" id="pf-repeat-row" aria-label="Repeat"></button>
  </div>
  <div class="pillrow">
    <button class="pill" id="pf-repeat"></button>
    <button class="pill" id="pf-download"></button>
    <button class="pill" id="pf-addpl"></button>
  </div>
  <div class="speedrow" id="pf-speeds"></div>
</div>

<div id="sheetwrap"><div id="sheet"></div></div>
<div id="toast"></div>
<audio id="audio" preload="auto"></audio>

function icon(name, size){ return '<svg viewBox="0 0 24 24" width="' + (size || 24) + '" height="' + (size || 24) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[name] + "</svg>"; }

/* ============ derived: artists & genres ============ */
function buildArtists(){
  const map = new Map();
  const add = (name, kind, showIdx, epIdx) => {
    if (!name) return;
    if (!map.has(name)) map.set(name, { name, kind, shows: new Set(), eps: [] });
    const a = map.get(name);
    if (showIdx != null) a.shows.add(showIdx);
    if (epIdx != null) a.eps.push([showIdx, epIdx]);
  };
  SHOWS.forEach((sh, si) => {
    if (sh.pinned) return;
    if (sh.genre === "Urban Gospel" || sh.genre === "Teaching") add(sh.author, "artist", si, null);
    else if (sh.genre === "Sermon") sh.eps.forEach((e, ei) => add(e.a, "preacher", si, ei));
  });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}
const ARTISTS = buildArtists();
const GENRES = [...new Set(SHOWS.map(s => s.genre))].sort((a, b) => {
  const order = { "Urban Gospel": 0, "Sermon": 1, "Teaching": 2 }; return (order[a] ?? 9) - (order[b] ?? 9);
});

/* ============ navigation ============ */
let stack = [{ name: "home" }];
const TITLES = { home: "Start Listening", albums: "Albums", artists: "Artists", playlists: "Playlists", genres: "Genres", search: "Search" };
function nav(name, param){ stack.push({ name, param }); render(); window.scrollTo(0, 0); }
function goTab(name){ stack = [{ name }]; render(); window.scrollTo(0, 0); }
function goBack(){ if (stack.length > 1){ stack.pop(); render(); window.scrollTo(0, 0); } }
function curView(){ return stack[stack.length - 1]; }

function render(){
  const v = curView();
  const titles = { show: p => SHOWS[p].title, artist: p => ARTISTS[p].name, genre: p => p, playlist: p => playlists[p] ? playlists[p].name : "Playlist", bplaylist: p => BUILTINS[p] ? BUILTINS[p].name : "Playlist" };
  document.getElementById("apptitle").textContent = titles[v.name] ? titles[v.name](v.param) : (TITLES[v.name] || "Start Listening");
  document.getElementById("backbtn").style.display = stack.length > 1 ? "" : "none";
  document.querySelectorAll("#tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab === v.name && stack.length === 1));
  const el = document.getElementById("view");
  if (v.name === "home") el.innerHTML = vHome();
  else if (v.name === "albums") el.innerHTML = vAlbums();
  else if (v.name === "artists") el.innerHTML = vArtists();
  else if (v.name === "artist") el.innerHTML = vArtist(v.param);
  else if (v.name === "genres") el.innerHTML = vGenres();
  else if (v.name === "genre") el.innerHTML = vGenre(v.param);
  else if (v.name === "playlists") el.innerHTML = vPlaylists();
  else if (v.name === "playlist") el.innerHTML = vPlaylist(v.param);
  else if (v.name === "bplaylist") el.innerHTML = vBPlaylist(v.param);
  else if (v.name === "search") { el.innerHTML = vSearch(); const inp = document.getElementById("searchbox"); if (inp){ inp.focus(); } }
  else if (v.name === "show") el.innerHTML = vShow(v.param);
  refreshDlButtons();
}

function doSearch(q){
  q = q.trim().toLowerCase();
  const box = document.getElementById("searchresults"); if (!box) return;
  if (!q){ box.innerHTML = '<div class="empty">Type to search.</div>'; return; }
  const showHits = SHOWS.map((s, i) => (s.title.toLowerCase().includes(q) || s.author.toLowerCase().includes(q)) ? i : -1).filter(i => i >= 0).slice(0, 12);
  const epHits = [];
  for (let si = 0; si < SHOWS.length && epHits.length < 60; si++){
    const eps = SHOWS[si].eps;
    for (let ei = 0; ei < eps.length && epHits.length < 60; ei++) if (eps[ei].t.toLowerCase().includes(q)) epHits.push([si, ei]);
  }
  let h = "";
  if (showHits.length) h += '<h3 class="sub">Shows</h3>' + showHits.map(si => '<button class="listrow" data-act="open-show" data-s="' + si + '"><img loading="lazy" src="' + esc(SHOWS[si].cover) + '" alt=""><span><span class="lt">' + esc(SHOWS[si].title) + '</span><span class="lm" style="display:block">' + esc(SHOWS[si].author) + '</span></span><span class="chev">›</span></button>').join("");
  if (epHits.length) h += '<h3 class="sub">Episodes</h3>' + epHits.map(([si, ei]) => epRow(si, ei)).join("");
  box.innerHTML = h || '<div class="empty">No matches for “' + esc(q) + '”.</div>';
  refreshDlButtons();
}

/* ============ playback engine ============ */
const audio = document.getElementById("audio");
let queue = [], queueOrig = [], qpos = -1;
let cur = { s: -1, e: -1 };
let blobUrl = null, wantPlay = false, lastSave = 0;

function shuffleArr(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function applyShuffleOrder(refs, startIdx){
  const first = refs[startIdx];
  const rest = refs.filter((_, i) => i !== startIdx);
  return [first, ...shuffleArr(rest)];
}
function playRefs(refs, startIdx, startShuffled){
  if (!refs.length) return;
  queueOrig = refs.map(r => [r[0], r[1]]);
  const shuffled = startShuffled != null ? startShuffled : prefs.shuffle;
  queue = shuffled ? applyShuffleOrder(queueOrig, startIdx) : queueOrig.slice();
  qpos = shuffled ? 0 : startIdx;
  loadEp(qpos, true);
}
function playShow(si, shuffled){ playRefs(SHOWS[si].eps.map((_, ei) => [si, ei]), 0, shuffled); }
function artistRefs(ai){
  const a = ARTISTS[ai], refs = [];
  if (a.kind === "preacher"){ a.eps.forEach(r => refs.push([r[0], r[1]])); }
  else { [...a.shows].sort((x, y) => x - y).forEach(si => SHOWS[si].eps.forEach((_, ei) => refs.push([si, ei]))); }
  return refs;
}
async function resolveSrc(url){
  if (blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  if (cacheOK && dlMeta[url]){
    try { const c = await caches.open(CACHE_NAME); const m = await c.match(url); if (m){ blobUrl = URL.createObjectURL(await m.blob()); return blobUrl; } } catch(e){}
  }
  return url;
}
async function loadEp(pos, autoplay){
  if (pos < 0 || pos >= queue.length) return;
  qpos = pos;
  const [si, ei] = queue[qpos];
  cur = { s: si, e: ei };
  const e = ep(si, ei), sh = SHOWS[si];
  wantPlay = !!autoplay;
  audio.src = await resolveSrc(e.u);
  audio.playbackRate = prefs.speed;
  const saved = positions[e.u];
  const seekTo = (saved && e.d && saved < e.d - 10) ? saved : 0;
  const doSeek = () => { if (seekTo > 0){ try { audio.currentTime = seekTo; } catch(err){} } audio.removeEventListener("loadedmetadata", doSeek); };
  audio.addEventListener("loadedmetadata", doSeek);
  if (autoplay) audio.play().catch(() => {});
  lastPlay = { s: si, e: ei, queue: queueOrig, qi: queueOrig.findIndex(r => r[0] === si && r[1] === ei), pos: seekTo };
  LS.set("last", lastPlay);
  recent = [[si, ei], ...recent.filter(r => !(r[0] === si && r[1] === ei))].slice(0, 30);
  LS.set("recent", recent);
  updatePlayerUI();
  if (curView().name !== "search") render();
  if ("mediaSession" in navigator){
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: e.t, artist: e.a, album: sh.title, artwork: [{ src: sh.cover, sizes: "512x512", type: "image/jpeg" }] });
    } catch(err){}
  }
}
function step(d, fromEnded){
  if (qpos < 0) return;
  if (d > 0){
    if (qpos < queue.length - 1) loadEp(qpos + 1, true);
    else if (prefs.repeat === "all") loadEp(0, true);
    else if (fromEnded) updatePlayerUI();
  } else {
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    if (qpos > 0) loadEp(qpos - 1, true);
    else audio.currentTime = 0;
  }
}
function togglePlay(){
  if (qpos < 0){ if (COMBINED >= 0) playShow(COMBINED, false); return; }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
}
function setRepeat(mode){
  prefs.repeat = mode; LS.set("prefs", prefs); updateRepeatUI();
}
function cycleRepeat(){ setRepeat(prefs.repeat === "off" ? "all" : prefs.repeat === "all" ? "one" : "off"); }
function setShuffle(on){
  prefs.shuffle = on; LS.set("prefs", prefs);
  if (qpos >= 0){
    const curRef = queue[qpos];
    if (on){ queue = [curRef, ...shuffleArr(queueOrig.filter(r => !(r[0] === curRef[0] && r[1] === curRef[1])))]; qpos = 0; }
    else { queue = queueOrig.slice(); qpos = queueOrig.findIndex(r => r[0] === curRef[0] && r[1] === curRef[1]); if (qpos < 0) qpos = 0; }
    lastPlay = { s: curRef[0], e: curRef[1], queue: queueOrig, qi: queueOrig.findIndex(r => r[0] === curRef[0] && r[1] === curRef[1]), pos: audio.currentTime || 0 };
    LS.set("last", lastPlay);
  }
  updateShuffleUI(); updateUpNext();
}
function savePos(){
  if (cur.s < 0) return;
  const e = ep(cur.s, cur.e);
  if (audio.duration && audio.currentTime > audio.duration - 15) delete positions[e.u];
  else if (audio.currentTime > 0) positions[e.u] = Math.floor(audio.currentTime);
  LS.set("pos", positions);
  if (lastPlay){ lastPlay.pos = audio.currentTime || 0; LS.set("last", lastPlay); }
}

/* ============ player UI ============ */
const $ = id => document.getElementById(id);
function updatePlayerUI(){
  const has = qpos >= 0 && cur.s >= 0;
  $("minibar").classList.toggle("show", has);
  if (!has) return;
  const e = ep(cur.s, cur.e), sh = SHOWS[cur.s];
  $("mb-cov").src = sh.cover; $("mb-title").textContent = e.t; $("mb-artist").textContent = e.a + " · " + sh.title;
  $("pf-cov").src = sh.cover; $("pf-title").textContent = e.t; $("pf-artist").textContent = e.a + " · " + sh.title;
  updatePlayBtns(); updateRepeatUI(); updateShuffleUI(); updateUpNext(); updatePfDownload();
}
function updatePlayBtns(){
  const ic = icon(audio.paused ? "play" : "pause", 26);
  $("mb-play").innerHTML = ic; $("pf-play").innerHTML = icon(audio.paused ? "play" : "pause", 32);
}
function updateRepeatUI(){
  const on = prefs.repeat !== "off";
  const label = prefs.repeat === "off" ? "Repeat off" : prefs.repeat === "all" ? "Loop all" : "Loop one";
  $("mb-repeat").innerHTML = icon("repeat", 20);
  $("mb-repeat").classList.toggle("on", on);
  $("pf-repeat-row").innerHTML = repeatIcon();
  $("pf-repeat-row").classList.toggle("on", on);
  $("pf-repeat").innerHTML = icon("repeat", 16) + " " + label;
  $("pf-repeat").classList.toggle("on", on);
}
function updateShuffleUI(){ $("pf-shuffle").innerHTML = icon("shuffle", 24); $("pf-shuffle").classList.toggle("on", prefs.shuffle); }
function updateUpNext(){
  let txt = "";
  if (qpos >= 0){
    if (prefs.repeat === "one") txt = "Looping this episode";
    else if (qpos < queue.length - 1){ const n = queue[qpos + 1]; txt = "Up next: " + ep(n[0], n[1]).t; }
    else if (prefs.repeat === "all" && queue.length > 1) txt = "Up next: " + ep(queue[0][0], queue[0][1]).t + " (loop)";
  }
  $("pf-upnext").textContent = txt;
}
function updatePfDownload(){
  const b = $("pf-download"); if (cur.s < 0) return;
  const url = epKey(cur.s, cur.e);
  if (!cacheOK){ b.style.display = "none"; return; }
  b.style.display = "";
  const done = !!dlMeta[url];
  b.innerHTML = icon(done ? "check" : "download", 16) + (done ? " Downloaded" : " Download");
  b.classList.toggle("on", done);
}
audio.addEventListener("play", updatePlayBtns);
audio.addEventListener("pause", () => { updatePlayBtns(); savePos(); });
audio.addEventListener("ended", () => {
  if (cur.s >= 0){ delete positions[epKey(cur.s, cur.e)]; LS.set("pos", positions); }
  if (prefs.repeat === "one" && qpos >= 0){ audio.currentTime = 0; audio.play().catch(() => {}); return; }
  step(1, true);
});
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || 0, c = audio.currentTime || 0;
  $("pf-cur").textContent = fmtDur(c); $("pf-dur").textContent = fmtDur(d);
  if (d > 0 && document.activeElement !== $("pf-seek")) $("pf-seek").value = Math.round(1000 * c / d);
  $("mb-prog").style.width = d > 0 ? (100 * c / d) + "%" : "0%";
  const now = Date.now();
  if (now - lastSave > 4000){ lastSave = now; savePos(); }
});
audio.addEventListener("loadedmetadata", () => { audio.playbackRate = prefs.speed; });
window.addEventListener("beforeunload", savePos);
if ("mediaSession" in navigator){
  const ms = navigator.mediaSession;
  try {
    ms.setActionHandler("play", () => audio.play().catch(() => {}));
    ms.setActionHandler("pause", () => audio.pause());
    ms.setActionHandler("previoustrack", () => step(-1));
    ms.setActionHandler("nexttrack", () => step(1));
    ms.setActionHandler("seekbackward", () => { audio.currentTime = Math.max(0, audio.currentTime - 30); });
    ms.setActionHandler("seekforward", () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); });
    ms.setActionHandler("seekto", ev => { if (ev.seekTime != null) audio.currentTime = ev.seekTime; });
  } catch(e){}
}

/* ============ downloads ============ */
const CACHE_NAME = "sl-audio-v1";
const cacheOK = ("caches" in window);
const dlBusy = new Set();
async function downloadEp(si, ei){
  const url = epKey(si, ei);
  if (!cacheOK || dlMeta[url] || dlBusy.has(url)) return dlMeta[url] ? true : false;
  dlBusy.add(url); refreshDlButtons();
  try {
    const c = await caches.open(CACHE_NAME);
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    await c.put(url, resp);
    dlMeta[url] = { s: si, e: ei }; LS.set("downloads", dlMeta);
    dlBusy.delete(url); refreshDlButtons(); updatePfDownload();
    return true;
  } catch(err){
    dlBusy.delete(url); refreshDlButtons(url);
    return false;
  }
}
async function removeDownload(si, ei){
  const url = epKey(si, ei);
  try { const c = await caches.open(CACHE_NAME); await c.delete(url); } catch(e){}
  delete dlMeta[url]; LS.set("downloads", dlMeta);
  refreshDlButtons(); updatePfDownload();
}
function refreshDlButtons(failedUrl){
  document.querySelectorAll("[data-dl]").forEach(b => {
    const si = +b.dataset.s, ei = +b.dataset.e, url = epKey(si, ei);
    if (dlMeta[url]){ b.innerHTML = icon("check"); b.classList.add("done"); b.classList.remove("fail", "busy"); }
    else if (dlBusy.has(url)){ b.innerHTML = icon("download"); b.classList.add("busy"); b.classList.remove("done", "fail"); }
    else if (failedUrl && url === failedUrl){ b.innerHTML = icon("download"); b.classList.add("fail"); b.classList.remove("done", "busy"); b.title = "Download failed — tap to retry"; }
    else { b.innerHTML = icon("download"); b.classList.remove("done", "fail", "busy"); }
  });
  if (!cacheOK) document.querySelectorAll("[data-dl]").forEach(b => b.style.display = "none");
}
async function downloadAll(refs, btn){
  if (!cacheOK){ toast("Downloads aren't supported in this browser"); return; }
  const todo = refs.filter(([si, ei]) => !dlMeta[epKey(si, ei)]);
  if (!todo.length){ toast("Everything is already downloaded"); return; }
  btn.classList.add("busy"); const orig = btn.innerHTML;
  let ok = 0, fail = 0;
  for (let i = 0; i < todo.length; i++){
    btn.innerHTML = "Downloading " + (i + 1) + "/" + todo.length + "…";
    (await downloadEp(todo[i][0], todo[i][1])) ? ok++ : fail++;
  }
  btn.classList.remove("busy"); btn.innerHTML = orig;
  toast("Downloaded " + ok + (fail ? " · " + fail + " failed (tap an episode to retry)" : ""));
  render();
}
async function updateUsage(){
  const el = document.getElementById("dlusage"); if (!el) return;
  if (navigator.storage && navigator.storage.estimate){
    try { const est = await navigator.storage.estimate(); el.textContent = "Storage used by downloads: " + (est.usage ? (est.usage / 1048576).toFixed(1) + " MB" : "—") + (est.quota ? " of " + (est.quota / 1073741824).toFixed(1) + " GB available" : ""); return; } catch(e){}
  }
  el.textContent = "";
}

/* ============ sheets (episode menu / playlist picker) ============ */
function openSheet(html){ $("sheet").innerHTML = html; $("sheetwrap").classList.add("show"); }
function closeSheet(){ $("sheetwrap").classList.remove("show"); }
function epMenu(si, ei){
  const e = ep(si, ei);
  let rows = '<button class="sheetrow" data-act="sheet-addpl" data-s="' + si + '" data-e="' + ei + '">' + icon("plus", 19) + " Add to playlist…</button>";
  if (cacheOK && dlMeta[e.u]) rows += '<button class="sheetrow" data-act="sheet-rmdl" data-s="' + si + '" data-e="' + ei + '">' + icon("x", 19) + " Remove download</button>";
  openSheet("<h3>" + esc(e.t) + '</h3><div class="small muted" style="margin:-6px 0 8px">' + esc(SHOWS[si].title) + "</div>" + rows);
}
function plPicker(si, ei){
  let rows = playlists.map((p, pi) => '<button class="sheetrow" data-act="sheet-plpick" data-pl="' + pi + '" data-s="' + si + '" data-e="' + ei + '">' + icon("list", 19) + " " + esc(p.name) + ' <span class="muted small">(' + p.items.length + ")</span></button>").join("");
  rows += '<button class="sheetrow" data-act="sheet-plnew" data-s="' + si + '" data-e="' + ei + '">' + icon("plus", 19) + " New playlist…</button>";
  openSheet("<h3>Add to playlist</h3>" + rows);
}
function addToPlaylist(pi, si, ei){
  if (playlists[pi].items.some(r => r[0] === si && r[1] === ei)){ toast("Already in “" + playlists[pi].name + "”"); return; }
  playlists[pi].items.push([si, ei]); LS.set("playlists", playlists);
  toast("Added to “" + playlists[pi].name + "”");
}

/* ============ global events ============ */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act]");
  if (t){
    const act = t.dataset.act, si = +t.dataset.s, ei = +t.dataset.e, i = +t.dataset.i;
    if (act === "open-show") nav("show", si);
    else if (act === "open-artist") nav("artist", i);
    else if (act === "open-genre") nav("genre", t.dataset.g);
    else if (act === "open-playlist") nav("playlist", i);
    else if (act === "open-bplaylist") nav("bplaylist", i);
    else if (act === "continue"){ if (lastPlay){ const q = (lastPlay.queue && lastPlay.queue.length) ? lastPlay.queue : SHOWS[lastPlay.s].eps.map((_, x) => [lastPlay.s, x]); const qi = lastPlay.qi != null && lastPlay.qi >= 0 ? lastPlay.qi : lastPlay.e; playRefs(q, qi); } }
    else if (act === "play-ep") playRefs(SHOWS[si].eps.map((_, x) => [si, x]), ei, false);
    else if (act === "play-show") playShow(i, false);
    else if (act === "shuffle-show") playShow(i, true);
    else if (act === "play-artist") playRefs(artistRefs(i), 0, false);
    else if (act === "shuffle-artist") playRefs(artistRefs(i), 0, true);
    else if (act === "play-playlist"){ const p = playlists[i]; if (p && p.items.length) playRefs(p.items, 0, false); else toast("Playlist is empty"); }
    else if (act === "shuffle-playlist"){ const p = playlists[i]; if (p && p.items.length) playRefs(p.items, 0, true); else toast("Playlist is empty"); }
    else if (act === "play-playlist-ep"){ const p = playlists[+t.dataset.pl]; if (p) playRefs(p.items, i, false); }
    else if (act === "play-bplaylist"){ const bp = BUILTINS[i]; if (bp && bp.items.length) playRefs(bp.items, 0, false); else toast("Playlist is empty"); }
    else if (act === "shuffle-bplaylist"){ const bp = BUILTINS[i]; if (bp && bp.items.length) playRefs(bp.items, 0, true); else toast("Playlist is empty"); }
    else if (act === "play-bplaylist-ep"){ const bp = BUILTINS[+t.dataset.bpl]; if (bp) playRefs(bp.items, i, false); }
    else if (act === "dl-ep"){ if (!dlMeta[epKey(si, ei)]){ const ok = await downloadEp(si, ei); toast(ok ? "Downloaded for offline" : "Download failed — tap to retry"); } }
    else if (act === "dlall-show") downloadAll(SHOWS[i].eps.map((_, x) => [i, x]), t);
    else if (act === "dlall-artist") downloadAll(artistRefs(i), t);
    else if (act === "dlall-playlist"){ const p = playlists[i]; if (p) downloadAll(p.items, t); }
    else if (act === "dlall-bplaylist"){ const bp = BUILTINS[i]; if (bp) downloadAll(bp.items, t); }
    else if (act === "dl-remove"){ await removeDownload(si, ei); render(); toast("Download removed"); }
    else if (act === "dl-remove-all"){ if (confirm("Remove all downloads?")){ for (const u of Object.keys(dlMeta)){ try { const c = await caches.open(CACHE_NAME); await c.delete(u); } catch(e){} } dlMeta = {}; LS.set("downloads", dlMeta); render(); toast("All downloads removed"); } }
    else if (act === "ep-menu") epMenu(si, ei);
    else if (act === "sheet-addpl"){ closeSheet(); plPicker(si, ei); }
    else if (act === "sheet-rmdl"){ closeSheet(); await removeDownload(si, ei); toast("Download removed"); }
    else if (act === "sheet-plpick"){ addToPlaylist(+t.dataset.pl, si, ei); closeSheet(); }
    else if (act === "sheet-plnew"){ const name = prompt("Name for the new playlist:"); if (name && name.trim()){ playlists.push({ id: Date.now(), name: name.trim(), items: [] }); LS.set("playlists", playlists); addToPlaylist(playlists.length - 1, si, ei); } closeSheet(); }
    else if (act === "pl-new"){ const name = prompt("Name for the new playlist:"); if (name && name.trim()){ playlists.push({ id: Date.now(), name: name.trim(), items: [] }); LS.set("playlists", playlists); render(); } }
    else if (act === "pl-rename"){ const p = playlists[i]; const name = prompt("Rename playlist:", p.name); if (name && name.trim()){ p.name = name.trim(); LS.set("playlists", playlists); render(); } }
    else if (act === "pl-delete"){ if (confirm("Delete playlist “" + playlists[i].name + "”?")){ playlists.splice(i, 1); LS.set("playlists", playlists); goBack(); } }
    else if (act === "pl-remove"){ playlists[+t.dataset.pl].items.splice(i, 1); LS.set("playlists", playlists); render(); }
    else if (act === "pl-up"){ const p = playlists[+t.dataset.pl]; if (i > 0){ [p.items[i - 1], p.items[i]] = [p.items[i], p.items[i - 1]]; LS.set("playlists", playlists); render(); } }
    else if (act === "pl-down"){ const p = playlists[+t.dataset.pl]; if (i < p.items.length - 1){ [p.items[i + 1], p.items[i]] = [p.items[i], p.items[i + 1]]; LS.set("playlists", playlists); render(); } }
    return;
  }
  if (ev.target === $("sheetwrap")) closeSheet();
});
$("backbtn").addEventListener("click", goBack);
$("minibar").addEventListener("click", ev => { if (!ev.target.closest("button")) $("player").classList.add("show"); });
$("mb-play").addEventListener("click", togglePlay);
$("mb-repeat").addEventListener("click", cycleRepeat);
$("pf-close").addEventListener("click", () => $("player").classList.remove("show"));
$("pf-play").addEventListener("click", togglePlay);
$("pf-prev").addEventListener("click", () => step(-1));
$("pf-next").addEventListener("click", () => step(1));
$("pf-back30").addEventListener("click", () => { audio.currentTime = Math.max(0, audio.currentTime - 30); });
$("pf-fwd30").addEventListener("click", () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); });
$("pf-seek").addEventListener("input", () => { if (audio.duration) audio.currentTime = audio.duration * (+$("pf-seek").value) / 1000; });
$("pf-repeat").addEventListener("click", cycleRepeat);
$("pf-repeat-row").addEventListener("click", cycleRepeat);
$("pf-shuffle").addEventListener("click", () => setShuffle(!prefs.shuffle));
$("pf-download").addEventListener("click", async () => { if (cur.s >= 0){ if (dlMeta[epKey(cur.s, cur.e)]){ await removeDownload(cur.s, cur.e); toast("Download removed"); } else { const ok = await downloadEp(cur.s, cur.e); toast(ok ? "Downloaded for offline" : "Download failed — tap to retry"); } } });
$("pf-addpl").addEventListener("click", () => { if (cur.s >= 0) plPicker(cur.s, cur.e); });
document.addEventListener("input", ev => { if (ev.target && ev.target.id === "searchbox") doSearch(ev.target.value); });

/* ============ init ============ */
(function init(){
  const tabs = [["home", "Home"], ["albums", "Albums"], ["artists", "Artists"], ["playlists", "Playlists"], ["genres", "Genres"], ["search", "Search"]];
  $("tabbar").innerHTML = tabs.map(([n, l]) => '<button data-tab="' + n + '">' + icon(n === "albums" ? "album" : n === "artists" ? "artist" : n === "playlists" ? "list" : n === "genres" ? "genre" : n, 23) + "<span>" + l + "</span></button>").join("");
  document.querySelectorAll("#tabbar button").forEach(b => b.addEventListener("click", () => goTab(b.dataset.tab)));
  $("pf-prev").innerHTML = icon("prev"); $("pf-next").innerHTML = icon("next");
  $("pf-back30").innerHTML = icon("back30"); $("pf-fwd30").innerHTML = icon("fwd30");
  $("pf-addpl").innerHTML = icon("plus", 16) + " Add to playlist";
  $("pf-speeds").innerHTML = SPEEDS.map(v => '<button data-speed="' + v + '">' + v + "×</button>").join("");
  document.querySelectorAll("#pf-speeds button").forEach(b => b.addEventListener("click", () => {
    prefs.speed = +b.dataset.speed; LS.set("prefs", prefs); audio.playbackRate = prefs.speed;
    document.querySelectorAll("#pf-speeds button").forEach(x => x.classList.toggle("on", +x.dataset.speed === prefs.speed));
  }));
  document.querySelectorAll("#pf-speeds button").forEach(x => x.classList.toggle("on", +x.dataset.speed === prefs.speed));
  render();
  if (curView().name === "playlists") updateUsage();
  const origRender = render;
  render = function(){ origRender(); if (curView().name === "playlists") updateUsage(); };
})();
</script>
